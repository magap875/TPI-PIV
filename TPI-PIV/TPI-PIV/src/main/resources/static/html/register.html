<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrarse - SevenBets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/alertas.css"/>

    <style>
        body {
            font-family: "Inter", sans-serif;
        }

        .title-font {
            font-family: "Rajdhani", sans-serif;
        }

        .hero-line {
            width: 140px;
            height: 3px;
            background: #05AC2E;
            border-radius: 3px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,100% {
                transform: scaleX(.6);
                opacity: .5;
            }

            50% {
                transform: scaleX(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body class="bg-white text-[#111111]">

    <nav class="bg-[#111111]">
        <div class="max-w-7xl mx-auto h-20 flex items-center px-10 justify-center">
            <img src="../images/logo.png" alt="Logo" class="h-14" />
        </div>
    </nav>

    <section class="bg-[#FCFCFC] pt-10 pb-4 flex flex-col items-center">
        <p class="title-font text-4xl uppercase font-bold text-center pt-10">Jugá. Predecí. Ganá.</p>

        <div class="hero-line mt-4"></div>
        <p class="text-sm text-gray-500 mt-4 text-center">
            Unite a la comunidad y empezá a competir fecha tras fecha.
        </p>
    </section>

    <main class="flex justify-center items-center px-6 py-12 bg-[#FCFCFC]">
        <div class="w-full max-w-md border border-gray-200 rounded-[3px] p-10 bg-white shadow-sm">
            <div class="mb-8 text-center">
                <p class="uppercase tracking-[2px] text-[#0AB529] text-xs font-semibold">Creá tu cuenta</p>

                <h2 class="title-font text-4xl font-bold mt-2 uppercase">Registrarse</h2>

                <p class="text-gray-500 mt-3 text-sm">Completá tus datos para comenzar.</p>
            </div>

            <form id="registerForm" class="space-y-5">
                <div>
                    <label class="block mb-2 text-sm font-medium">Nombre</label>

                    <input id="nombre" type="text" placeholder="Tu nombre" class="w-full h-12 px-4 border border-gray-300 rounded-[3px] outline-none focus:border-[#0AB529] transition"/>
                </div>

                <div>
                    <label class="block mb-2 text-sm font-medium">Email</label>

                    <input id="email" type="email" placeholder="correo@ejemplo.com" class="w-full h-12 px-4 border border-gray-300 rounded-[3px] outline-none focus:border-[#0AB529] transition"/>
                </div>

                <div>
                    <label class="block mb-2 text-sm font-medium">Contraseña</label>

                    <input id="contrasena"type="password" placeholder="••••••••" class="w-full h-12 px-4 border border-gray-300 rounded-[3px] outline-none focus:border-[#0AB529] transition"/>
                </div>

                <button type="submit" class="w-full h-12 rounded-[3px] bg-[#05AC2E] text-white font-semibold text-sm hover:bg-[#111111] transition-all duration-300">
                    REGISTRARME
                </button>
            </form>

            <div class="mt-8 text-center text-sm text-gray-600">¿Ya tenés cuenta?
                <a href="login.html" class="font-semibold text-[#0AB529] hover:underline">Iniciar sesión</a>
            </div>
        </div>

    </main>
    <footer class="mt-10 p-10 text-center flex items-center justify-center text-gray-400 text-sm gap-2 bg-[#111111]">
        <img src="../images/logo-nombre.png" alt="Logo" class="h-3"/><p>| Viví cada fecha como nunca.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/register.js" defer></script>
</body>
</html>
